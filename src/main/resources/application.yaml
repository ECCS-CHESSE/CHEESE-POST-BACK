spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL}
      minimum-idle: ${DB_MIN_POOL}
      idle-timeout: ${DB_IDLE_TIMEOUT}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  output:
    ansi:
      enabled: ALWAYS

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

sync:
  scheduler:
    enabled: ${SYNC_SCHEDULER_ENABLED}
  sql:
    path: ${SYNC_SQL_PATH}
    procesados: ${SYNC_SQL_PROCESADOS}
  prod:
    url: ${SYNC_PROD_URL}

sucursal:
  id: ${SUCURSAL_ID}

logging:
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){bright_green} %clr(%5p){INFO=green, WARN=yellow, ERROR=red} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){blue} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %clr(%m){INFO=blue, WARN=yellow, ERROR=bright_red}%n%clr(%wEx){bright_red}'
  exception-conversion-word: '%clr(%rootException){bright_red}'
  level:
    root: ${LOGGING_LEVEL_ROOT}
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.Basic.Binder: TRACE
